name: "Setup Environment"
description: "Sets up Node.js, pnpm, and installs dependencies with caching"
inputs:
  node-version:
    description: "The Node.js version to use"
    required: false
    default: "24"
runs:
  using: "composite"
  steps:
    - name: Install pnpm (version comes from packageManager in package.json)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # Automatically caches dependencies based on pnpm-lock.yaml to speed up pipeline execution
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
